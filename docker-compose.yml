services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: file:/data/prod.db
      TOKEN_KEY: ${TOKEN_KEY:-change-me-in-production-please}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      OTP_TTL_SECONDS: 300
      OTP_DEV_MODE: "true"
    volumes:
      - cv-data:/data

volumes:
  cv-data:
