services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: file:/data/prod.db
      TOKEN_KEY: ${TOKEN_KEY:?set TOKEN_KEY before running}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OTP_TTL_SECONDS: 300
      # keep true only while testing; turn off when you wire real SMS
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
    volumes:
      - portfolio-data:/data
    restart: unless-stopped

volumes:
  portfolio-data:
