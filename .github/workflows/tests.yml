name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
          TOKEN_KEY: ci-test-secret
          DATABASE_URL: file:./test.db
          OTP_DEV_MODE: "true"
      - run: npm run build
